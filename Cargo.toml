[package]
name = "remote-rebirth"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Offline configuration tool for the Logitech Harmony 300"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-libusb"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
tempfile = "3.27.0"
