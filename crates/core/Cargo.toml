[package]
name = "remote-rebirth-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline configuration core for the Logitech Harmony 300"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-libusb"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

[dev-dependencies]
jsonschema = { version = "0.61.0", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
